# The install script in this repository is the one antitheft.pro serves: checked daily and on every change.
name: Install script matches antitheft.pro

on:
  push:
    paths: [install/**]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare with the live scripts
        run: |
          curl -fsSL --retry 3 https://antitheft.pro/antitheft.sh -o /tmp/antitheft.sh
          diff -u install/antitheft.sh /tmp/antitheft.sh
          echo "antitheft.sh: same as antitheft.pro/antitheft.sh"
