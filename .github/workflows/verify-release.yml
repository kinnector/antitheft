# Every published release is checked from the outside, the way anyone can: its signature against the antitheft
# release key, every file against the signed SHA-256, and the Windows install script run dry against it.
name: Verify release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (empty = latest)
        required: false

permissions:
  contents: read

jobs:
  signature:
    name: Signature and files (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir release
          gh release download ${TAG:+"$TAG"} --repo "$GITHUB_REPOSITORY" --dir release
          ls -l release
      - name: Verify
        run: |
          cd release
          files=$(ls | grep -v '^manifest\.')
          ../scripts/verify-release.sh manifest.token $files
      - name: manifest.json is the signed manifest
        run: |
          cd release
          token=$(cat manifest.token); p=${token%%.*}; p=$(printf '%s' "$p" | tr '_-' '/+'); while [ $(( ${#p} % 4 )) -ne 0 ]; do p="$p="; done
          signed=$(printf '%s' "$p" | base64 -d | jq -S '{version, files, importance}')
          plain=$(jq -S '{version, files, importance}' manifest.json)
          [ "$signed" = "$plain" ] || { echo "manifest.json differs from the signed manifest"; exit 1; }
          echo "manifest.json matches the signed manifest"

  windows:
    name: Signature, files and install script (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          New-Item -ItemType Directory release | Out-Null
          if ($env:TAG) { gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir release }
          else { gh release download --repo $env:GITHUB_REPOSITORY --dir release }
          Get-ChildItem release
      - name: Verify
        shell: powershell
        run: |
          $files = Get-ChildItem release | Where-Object { $_.Name -notlike 'manifest.*' } | ForEach-Object { $_.FullName }
          & .\scripts\verify-release.ps1 release\manifest.token @files
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Install script, dry run
        shell: powershell
        env:
          ANTITHEFT_DRY_RUN: '1'
        run: |
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File install\antitheft.ps1 *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'SHA-256 verified') { exit 1 }
