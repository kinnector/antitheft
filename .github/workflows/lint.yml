name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: |
          sh -n install/antitheft.sh
          bash -n scripts/verify-release.sh
          shellcheck --severity=error install/antitheft.sh scripts/verify-release.sh
      - name: PowerShell scripts
        shell: pwsh
        run: |
          $issues = @(); $tokens = $null; $errors = $null
          foreach ($f in 'install/antitheft.ps1', 'scripts/verify-release.ps1') {
            $issues += @(Invoke-ScriptAnalyzer -Path $f -Severity Error)
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$tokens, [ref]$errors)
            if ($errors) { $errors; exit 1 }
          }
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }
      - name: Issue forms are valid YAML
        run: |
          for f in .github/ISSUE_TEMPLATE/*.yml .github/workflows/*.yml; do
            yq e '.' "$f" >/dev/null || exit 1
          done
